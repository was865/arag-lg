[project]
name = "erp-mcp"
version = "0.1.0"
description = "ERP の MCP サーバ（specs/033）。業務の単位の読み取りの道具を出し、Odoo か模擬を読む"
requires-python = ">=3.13"
dependencies = [
    "mcp==1.30.0",
    "pyjwt>=2.10.1",
    "uvicorn>=0.31.1",
    "httpx>=0.28",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.14",
    "mypy>=1.18",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/erp_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
markers = ["odoo: compose の Odoo が要る結合テスト（ERP_ODOO_TEST=1 のときだけ）"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# 行の長さは formatter に任せる（日本語の全角は幅 2 で数えられ、文言を割ると読みにくい）
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.mypy]
strict = true
files = ["src"]
