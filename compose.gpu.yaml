# GPU 機（Windows + RTX 4090、Docker Desktop + WSL2）で推論サービスだけを起動する。
#   docker compose -f compose.gpu.yaml up -d
# Mac 側の .env で ARAG_TEI_EMBED_URL=http://<GPU機>:8081 / ARAG_TEI_RERANK_URL=http://<GPU機>:8084 を指定する。
# rerank の既定は ruri-v3-reranker-310m（:8084、specs/004-retrieval report §4）。ポートの意味は変えない
#   （:8082 は bge-reranker-v2-m3 のまま比較用に回した）。
# イメージ 89-* は Ada Lovelace（RTX 40 系, sm_89）用。
# docling-serve（解析、:5001）も同じファイルで起動する。Mac 側の .env で ARAG_DOCLING_URL=http://<GPU機>:5001
# 役割ごとに必要なサービスだけ起動できる（specs/016）。例: 埋め込みと rerank だけ
#   docker compose -f compose.gpu.yaml up -d tei-embed tei-rerank-ruri
# 会話・文脈付与の vLLM は --profile llm、図の説明の vLLM は --profile vlm。
# 比較用（ruri-v3-310m 埋め込み :8083・bge-reranker-v2-m3 :8082）は profile で別起動:
#   docker compose -f compose.gpu.yaml --profile compare up -d
name: arag-gpu

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  tei-embed:
    <<: *gpu
    image: ghcr.io/huggingface/text-embeddings-inference:89-1.9.4
    command: ["--model-id", "${TEI_EMBED_MODEL:-BAAI/bge-m3}", "--max-batch-tokens", "16384"]
    ports: ["8081:80"]
    volumes: [tei-cache:/data]
    restart: unless-stopped

  # 比較用（2026-11-08 までの既定）
  tei-rerank:
    <<: *gpu
    profiles: [compare]
    image: ghcr.io/huggingface/text-embeddings-inference:89-1.9.4
    command: ["--model-id", "BAAI/bge-reranker-v2-m3"]
    ports: ["8082:80"]
    volumes: [tei-cache:/data]
    restart: unless-stopped

  # 埋め込みの比較候補（specs/002-tei-verification）。接頭辞「検索クエリ: 」「検索文書: 」はアプリ側で付ける
  tei-embed-ruri:
    <<: *gpu
    profiles: [compare]
    image: ghcr.io/huggingface/text-embeddings-inference:89-1.9.4
    command: ["--model-id", "cl-nagoya/ruri-v3-310m", "--max-batch-tokens", "16384"]
    ports: ["8083:80"]
    volumes: [tei-cache:/data]
    restart: unless-stopped

  # rerank の既定。別モデルにするときは TEI_RERANK_MODEL と Mac 側の ARAG_RERANK_MODEL を合わせる
  tei-rerank-ruri:
    <<: *gpu
    image: ghcr.io/huggingface/text-embeddings-inference:89-1.9.4
    command: ["--model-id", "${TEI_RERANK_MODEL:-cl-nagoya/ruri-v3-reranker-310m}"]
    ports: ["8084:80"]
    volumes: [tei-cache:/data]
    restart: unless-stopped

  # 文脈付与の LLM（開発・評価用、specs/004-retrieval report §5）。profile で別起動:
  #   docker compose -f compose.gpu.yaml --profile llm up -d
  # WSL2 では --gpu-memory-utilization が KV を負に見積もるので KV の量を直接指定する。
  # ただし起動時の空き容量チェックは --gpu-memory-utilization（既定 0.92）で行われ、他と同居すると必ず失敗するので低くしておく
  # （実際の確保量には効かない。specs/016 vlm-compare.md）
  vllm:
    <<: *gpu
    profiles: [llm]
    image: vllm/vllm-openai:v0.32.0
    command:
      - "--model=Qwen/Qwen3-8B-AWQ"
      - "--served-model-name=qwen3-8b"
      - "--max-model-len=16384"
      - "--kv-cache-memory-bytes=2600M"
      - "--gpu-memory-utilization=${LLM_GPU_UTIL:-0.3}"
      - "--enable-prefix-caching"
      # エージェントのツール呼び出し（specs/005-agent）
      - "--enable-auto-tool-choice"
      - "--tool-call-parser=hermes"
    ports: ["8090:8000"]
    ipc: host
    volumes: [hf-cache:/root/.cache/huggingface]
    restart: unless-stopped
    # vllm-vl が起動完了を待つための目印（2 つを同時に起動すると CUDA graph の取得を取り合い 15 分以上止まる）
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      start_period: 1200s

  # 図の説明（specs/016 R3）。入庫のときだけ必要なので profile で別起動する:
  #   docker compose -f compose.gpu.yaml --profile vlm up -d
  # 既定は Qwen3-VL-8B-Instruct-FP8（Apache-2.0）。Qwen2.5-VL-7B-AWQ より図の説明が詳しく速い（specs/016 vlm-compare.md）。
  # Mac 側の .env: ARAG_VLM_MODEL=openai:qwen3-vl / ARAG_VLM_BASE_URL=http://<GPU機>:8091/v1
  # 24GB に TEI・vllm（llm）・docling と同居させるので文脈 8192・KV 1500M に固定する（16384 は KV 不足で起動しない）。
  # 24GB を超えても OOM にならず WDDM が他のメモリを追い出して静かに遅くなるので、KV は必要最小にする。
  # Qwen3-VL だけで会話も兼ねる構成（vllm を止める）: VLM_MAX_LEN=32768 VLM_KV_BYTES=4700M
  vllm-vl:
    <<: *gpu
    profiles: [vlm]
    # llm と一緒に起動するときは vllm の起動完了を待つ。vlm だけ（単一モデル構成）なら待たない
    depends_on:
      vllm: { condition: service_healthy, required: false }
    image: vllm/vllm-openai:v0.32.0
    command:
      - "--model=${VLM_HF_MODEL:-Qwen/Qwen3-VL-8B-Instruct-FP8}"
      - "--served-model-name=${VLM_SERVED_NAME:-qwen3-vl}"
      - "--max-model-len=${VLM_MAX_LEN:-8192}"
      - "--kv-cache-memory-bytes=${VLM_KV_BYTES:-1500M}"
      - "--gpu-memory-utilization=${VLM_GPU_UTIL:-0.3}"
      - "--limit-mm-per-prompt={\"image\": 1}"
      # 1 つのモデルで会話も兼ねる構成に備えてツール呼び出しを有効にする
      - "--enable-auto-tool-choice"
      - "--tool-call-parser=hermes"
    ports: ["8091:8000"]
    ipc: host
    volumes: [hf-cache:/root/.cache/huggingface]
    restart: unless-stopped

  # 解析（specs/003-ingestion G1）。cu130 はドライバ CUDA 13.x 以上が必要（GPU 機は 13.4）
  docling-serve:
    <<: *gpu
    image: ghcr.io/docling-project/docling-serve-cu130:v1.38.2
    ports: ["5001:5001"]
    volumes: [docling-cache:/opt/app-root/src/.cache]
    restart: unless-stopped

volumes:
  tei-cache:
  docling-cache:
  hf-cache:
