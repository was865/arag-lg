# GPU 機（Windows + RTX 4090、Docker Desktop + WSL2）で推論サービスだけを起動する。
#   docker compose -f compose.gpu.yaml up -d
# Mac 側の .env で ARAG_TEI_EMBED_URL=http://<GPU機>:8081 / ARAG_TEI_RERANK_URL=http://<GPU機>:8084 を指定する。
# rerank の既定は ruri-v3-reranker-310m（:8084、specs/004-retrieval report §4）。ポートの意味は変えない
#   （:8082 は bge-reranker-v2-m3 のまま比較用に回した）。
# イメージ 89-* は Ada Lovelace（RTX 40 系, sm_89）用。
# docling-serve（解析、:5001）も同じファイルで起動する。Mac 側の .env で ARAG_DOCLING_URL=http://<GPU機>:5001
# 役割ごとに必要なサービスだけ起動できる（specs/016）。例: 埋め込みと rerank だけ
#   docker compose -f compose.gpu.yaml up -d tei-embed tei-rerank-ruri
# 会話・文脈付与・図の説明は Gemma 4 12B の 1 つで兼ねる（--profile llm、:8093。2026-11-13 から既定）。
# 以前の構成（Qwen3-8B :8090・Qwen3-VL :8091）は 2026-11-28 に外した（定義は git の履歴にある）。
# 比較用（ruri-v3-310m 埋め込み :8083・bge-reranker-v2-m3 :8082）は profile で別起動:
#   docker compose -f compose.gpu.yaml --profile compare up -d
name: arag-gpu

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  tei-embed:
    <<: *gpu
    image: ghcr.io/huggingface/text-embeddings-inference:89-1.9.4
    command: ["--model-id", "${TEI_EMBED_MODEL:-BAAI/bge-m3}", "--max-batch-tokens", "16384"]
    ports: ["8081:80"]
    volumes: [tei-cache:/data]
    restart: unless-stopped

  # 比較用（2026-11-08 までの既定）
  tei-rerank:
    <<: *gpu
    profiles: [compare]
    image: ghcr.io/huggingface/text-embeddings-inference:89-1.9.4
    command: ["--model-id", "BAAI/bge-reranker-v2-m3"]
    ports: ["8082:80"]
    volumes: [tei-cache:/data]
    restart: unless-stopped

  # 埋め込みの比較候補（specs/002-tei-verification）。接頭辞「検索クエリ: 」「検索文書: 」はアプリ側で付ける
  tei-embed-ruri:
    <<: *gpu
    profiles: [compare]
    image: ghcr.io/huggingface/text-embeddings-inference:89-1.9.4
    command: ["--model-id", "cl-nagoya/ruri-v3-310m", "--max-batch-tokens", "16384"]
    ports: ["8083:80"]
    volumes: [tei-cache:/data]
    restart: unless-stopped

  # rerank の既定。別モデルにするときは TEI_RERANK_MODEL と Mac 側の ARAG_RERANK_MODEL を合わせる
  tei-rerank-ruri:
    <<: *gpu
    image: ghcr.io/huggingface/text-embeddings-inference:89-1.9.4
    command: ["--model-id", "${TEI_RERANK_MODEL:-cl-nagoya/ruri-v3-reranker-310m}"]
    ports: ["8084:80"]
    volumes: [tei-cache:/data]
    restart: unless-stopped

  # 会話・文脈付与・図の説明を 1 つで兼ねる既定のモデル（specs/026 の再評価で採用）。
  #   docker compose -f compose.gpu.yaml --profile llm up -d
  # Google 公式の QAT INT4（Apache-2.0、約 9.6GB）。TEI・docling と同居して専用 VRAM は約 15〜17GB。
  # harukaze_mix 69 題: 事実網羅 0.971・引用再現率 0.993（Qwen3-8B は 0.949・0.978）。
  # ツールの強制（tool_choice=required）には従わないが、エージェントは強制しない作り（specs/026 R11）。
  # Mac 側の .env: ARAG_CHAT_MODELS の先頭に gemma4-12b（base_url http://<GPU機>:8093/v1）、
  #   ARAG_UTILITY_MODEL=gemma4-12b、ARAG_CONTEXT_MODEL / ARAG_VLM_MODEL=openai:gemma4-12b
  gemma:
    <<: *gpu
    profiles: [llm]
    image: vllm/vllm-openai:v0.32.0
    command:
      - "--model=${GEMMA_HF_MODEL:-google/gemma-4-12B-it-qat-w4a16-ct}"
      - "--revision=${GEMMA_REVISION:-1d2c2d7f2466070e69d6fb3fd5ce9a7d75f2f6ee}"
      - "--served-model-name=gemma4-12b"
      - "--max-model-len=${GEMMA_MAX_LEN:-32768}"
      - "--kv-cache-memory-bytes=${GEMMA_KV_BYTES:-3000M}"
      - "--gpu-memory-utilization=${GEMMA_GPU_UTIL:-0.3}"
      - "--max-num-seqs=8"
      - "--limit-mm-per-prompt={\"image\": 1}"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser=gemma4"
      - "--reasoning-parser=gemma4"
    ports: ["8093:8000"]
    ipc: host
    volumes: [hf-cache:/root/.cache/huggingface]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      start_period: 1200s

  # 解析（specs/003-ingestion G1）。cu130 はドライバ CUDA 13.x 以上が必要（GPU 機は 13.4）
  docling-serve:
    <<: *gpu
    image: ghcr.io/docling-project/docling-serve-cu130:v1.38.2
    ports: ["5001:5001"]
    volumes: [docling-cache:/opt/app-root/src/.cache]
    restart: unless-stopped

volumes:
  tei-cache:
  docling-cache:
  hf-cache:
