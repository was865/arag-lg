[project]
name = "arag"
version = "0.1.0"
description = "ARag API（LangChain / LangGraph 版・日本語）"
authors = [
    { name = "was865", email = "wangansen865@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "docling-core[chunking]>=2.106.0",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.162",
    "httpx>=0.28.1",
    "langchain>=1.4.9",
    "langchain-anthropic>=1.7.10",
    "langchain-deepseek>=1.1.1",
    "langchain-openai>=1.7.4",
    "langgraph-checkpoint-postgres>=3.2.0",
    "pillow>=11",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.10",
    "pypdf>=7.0.0",
    "python-multipart>=0.0.33",
    "pyyaml>=6",
    "qdrant-client>=1.20.0",
    "redis>=8.1.0",
    "snowballstemmer>=3",
    "sqlalchemy[asyncio]>=2.1.8",
    "structlog>=26.1.0",
    "sudachidict-core>=20261015",
    "sudachipy>=0.7.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
assets = [
    "openpyxl>=3.1.5",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "reportlab>=5.1.0",
]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # 日本語の全角記号を許可

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["arag"]

[[tool.mypy.overrides]]
# 型情報を同梱していない依存
module = ["sudachipy.*", "snowballstemmer.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = ["integration: compose の infra（postgres・qdrant・redis）が必要"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
