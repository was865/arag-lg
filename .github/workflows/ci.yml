# CI（specs/001-p0-skeleton R17・R18）
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with: { version: "0.13.6", enable-cache: true }
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # compose.yaml は BETTER_AUTH_SECRET を必須にしている（起動しないサービスも含めてファイル全体を検証する）。
      # CI では実行ごとに使い捨ての値を作る（リポジトリにも秘密にも置かない）
      - name: CI 用の使い捨ての BETTER_AUTH_SECRET
        run: |
          v=$(openssl rand -hex 32)
          echo "::add-mask::$v"
          echo "BETTER_AUTH_SECRET=$v" >> "$GITHUB_ENV"
      - name: 結合テスト用の infra（postgres・qdrant・redis）
        run: docker compose up -d --wait --wait-timeout 120 postgres qdrant redis
      # integration マーカーのテストも含めて全件。infra に繋がらない環境では skip される
      - run: uv run pytest -q
      - name: scripts のテスト
        run: uv run pytest -q -p no:cacheprovider --rootdir ../scripts ../scripts

  # 評価用の模擬の社内システム（specs/032）。資料の xlsx と突き合わせるテストがある
  mock-systems:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: mock/systems } }
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with: { version: "0.13.6", enable-cache: true }
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q

  erp-mcp:
    # ERP の MCP サーバ（specs/033）。Odoo との契約のテストは ERP_ODOO_TEST=1 のときだけ（CI は mock）
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: mcp/erp } }
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with: { version: "0.13.6", enable-cache: true }
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q

  sim:
    # 模擬の世界と文書・題集の答え（specs/034）。world.db の再現と、題集の答えの一致を確かめる
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: sim } }
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with: { version: "0.13.6", enable-cache: true }
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6.1.0
        with: { package_json_file: web/package.json }
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  generated:
    name: 生成物の一致（OpenAPI・回答の流れの図）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with: { version: "0.13.6", enable-cache: true }
      - uses: pnpm/action-setup@v6.1.0
        with: { package_json_file: web/package.json }
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: cd api && uv sync --locked
      - run: cd web && pnpm install --frozen-lockfile
      - run: make gen-check
      - run: make graph-check

  licenses:
    name: ライセンス走査
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with: { version: "0.13.6", enable-cache: true }
      - uses: pnpm/action-setup@v6.1.0
        with: { package_json_file: web/package.json }
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: cd web && pnpm install --frozen-lockfile
      - run: make licenses

  compose-smoke:
    name: compose 起動スモーク
    runs-on: ubuntu-24.04
    needs: [api, web]
    env:
      # 本番の構成を確かめる（開発用の compose.override.yaml を読まない）
      COMPOSE_FILE: compose.yaml
      ARAG_TEI_EMBED_URL: http://tei-embed:80
      ARAG_TEI_RERANK_URL: http://tei-rerank:80
    steps:
      - uses: actions/checkout@v5
      # compose.yaml は BETTER_AUTH_SECRET を必須にしている（起動しないサービスも含めてファイル全体を検証する）。
      # CI では実行ごとに使い捨ての値を作る（リポジトリにも秘密にも置かない）
      - name: CI 用の使い捨ての BETTER_AUTH_SECRET
        run: |
          v=$(openssl rand -hex 32)
          echo "::add-mask::$v"
          echo "BETTER_AUTH_SECRET=$v" >> "$GITHUB_ENV"
      - run: docker compose --profile cpu up -d --build --wait --wait-timeout 300 postgres qdrant redis api web
      - run: docker compose --profile cpu up -d tei-embed tei-rerank
      - name: /readyz が 200 になるまで待つ（TEI のモデル取得を含む）
        run: |
          for i in $(seq 1 90); do
            code=$(curl -s -o /tmp/ready.json -w '%{http_code}' http://localhost:8100/readyz || true)
            if [ "$code" = "200" ]; then cat /tmp/ready.json; exit 0; fi
            sleep 10
          done
          cat /tmp/ready.json; exit 1
      - run: curl -fsS http://localhost:3100/api/healthz
      # ログインが必要になったので、未ログインのトップはログイン画面へ移る。画面が描画されることを確かめる
      - name: ログイン画面が表示される
        run: curl -fsSL http://localhost:3100/ | grep -q 'ログイン'
      - name: Valkey へ差し替えても起動する
        run: |
          docker compose rm -sf redis
          REDIS_IMAGE=valkey/valkey:9.1.3 REDIS_CLI=valkey-cli docker compose up -d --wait redis
          curl -fsS http://localhost:8100/readyz
      - if: failure()
        run: docker compose --profile cpu logs --no-color | tail -300
      - if: always()
        run: docker compose --profile cpu down -v
