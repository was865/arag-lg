# ARag 開発・CI 用の構成（specs/001-p0-skeleton/design.md）。
#   docker compose up -d                 … postgres / qdrant / redis / api / worker / runner / web
#   docker compose --profile cpu up -d   … 上記 + TEI（CPU・小モデル。amd64 のみ）+ docling-serve（CPU）
# 入庫ワーカー（worker）は埋め込み（ARAG_EMBED_URL か ARAG_TEI_EMBED_URL）が必要。未設定なら説明を出して終了する。
# 推論の各部品は自前か外部 API かを .env で選ぶ（specs/016。構成例は .env.example）。
# Mac では TEI を動かさず、GPU 機（compose.gpu.yaml）を ARAG_TEI_*_URL で参照する。
# ホスト側ポートは旧版 a-rag（5432/6333/6379/8000/3000）と同時に動かせるようずらしている。
name: arag

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: arag
      POSTGRES_PASSWORD: arag
      POSTGRES_DB: arag
    ports: ["${POSTGRES_PORT:-5433}:5432"]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arag -d arag"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports: ["${QDRANT_PORT:-6343}:6333", "${QDRANT_GRPC_PORT:-6344}:6334"]
    volumes: [qdrant:/qdrant/storage]
    healthcheck:
      # イメージに curl が無いため bash の /dev/tcp で /readyz を叩く
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    # Valkey へ切替: REDIS_IMAGE=valkey/valkey:9.1.3 REDIS_CLI=valkey-cli
    image: ${REDIS_IMAGE:-redis:8.10.3}
    ports: ["${REDIS_PORT:-6380}:6379"]
    healthcheck:
      test: ["CMD-SHELL", "${REDIS_CLI:-redis-cli} ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    environment: &api-env
      ARAG_DATABASE_URL: postgresql://arag:arag@postgres:5432/arag
      ARAG_QDRANT_URL: http://qdrant:6333
      ARAG_REDIS_URL: redis://redis:6379/0
      ARAG_TEI_EMBED_URL: ${ARAG_TEI_EMBED_URL:-}
      ARAG_TEI_RERANK_URL: ${ARAG_TEI_RERANK_URL:-}
      # 推論の部品（specs/016）: 自前（tei）か外部 API（openai / cohere 互換）かを選ぶ。例は .env.example
      ARAG_EMBED_PROVIDER: ${ARAG_EMBED_PROVIDER:-tei}
      ARAG_EMBED_URL: ${ARAG_EMBED_URL:-}
      ARAG_EMBED_API_KEY: ${ARAG_EMBED_API_KEY:-}
      ARAG_EMBED_MODEL: ${ARAG_EMBED_MODEL:-BAAI/bge-m3}
      ARAG_EMBED_DIMENSIONS: ${ARAG_EMBED_DIMENSIONS:-0}
      ARAG_EMBED_DOCUMENT_PREFIX: ${ARAG_EMBED_DOCUMENT_PREFIX:-}
      ARAG_EMBED_QUERY_PREFIX: ${ARAG_EMBED_QUERY_PREFIX:-}
      ARAG_QDRANT_COLLECTION: ${ARAG_QDRANT_COLLECTION:-chunks}
      ARAG_RERANK_PROVIDER: ${ARAG_RERANK_PROVIDER:-tei}
      ARAG_RERANK_URL: ${ARAG_RERANK_URL:-}
      ARAG_RERANK_API_KEY: ${ARAG_RERANK_API_KEY:-}
      ARAG_RERANK_MODEL: ${ARAG_RERANK_MODEL:-cl-nagoya/ruri-v3-reranker-310m}
      ARAG_RERANK_MAX_CHARS: ${ARAG_RERANK_MAX_CHARS:-0}
      ARAG_DOCLING_URL: ${ARAG_DOCLING_URL:-}
      # 認証（specs/006-auth）: Better Auth の JWT。評価・CLI は開発用ヘッダの api-eval を使う
      ARAG_AUTH_MODE: ${ARAG_AUTH_MODE:-jwt}
      ARAG_AUTH_JWKS_URL: http://web:3000/api/auth/jwks
      ARAG_AUTH_ISSUER: ${BETTER_AUTH_URL:-http://localhost:3100}
      ARAG_INGEST_CONCURRENCY: ${ARAG_INGEST_CONCURRENCY:-2}
      ARAG_CONTEXT_MODEL: ${ARAG_CONTEXT_MODEL:-}
      ARAG_CONTEXT_BASE_URL: ${ARAG_CONTEXT_BASE_URL:-}
      ARAG_CONTEXT_MODEL_KWARGS: ${ARAG_CONTEXT_MODEL_KWARGS:-{}}
      ARAG_CONTEXT_MAX_DOCUMENT_TOKENS: ${ARAG_CONTEXT_MAX_DOCUMENT_TOKENS:-60000}
      ARAG_CONTEXT_CONCURRENCY: ${ARAG_CONTEXT_CONCURRENCY:-8}
      ARAG_VLM_MODEL: ${ARAG_VLM_MODEL:-}
      ARAG_VLM_BASE_URL: ${ARAG_VLM_BASE_URL:-}
      ARAG_VLM_MODEL_KWARGS: ${ARAG_VLM_MODEL_KWARGS:-{}}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # P3 エージェント: モデル目録（JSON）と書き換え・要約用モデル（目録の id）
      ARAG_CHAT_MODELS: ${ARAG_CHAT_MODELS:-[]}
      ARAG_UTILITY_MODEL: ${ARAG_UTILITY_MODEL:-}
      # 管理画面で登録する API キーの暗号化鍵（specs/013-llm-keys）
      ARAG_SECRET_KEY: ${ARAG_SECRET_KEY:-}
      # Web の中継と共有する合言葉（監査ログに利用者の IP を残す）
      ARAG_FORWARD_SECRET: ${ARAG_FORWARD_SECRET:-}
      # 社内システム（MCP）に渡す利用者の身元の署名鍵（specs/032。模擬のサーバと共有する）
      ARAG_MCP_IDENTITY_KEY: ${ARAG_MCP_IDENTITY_KEY:-}
      ARAG_RUN_CONCURRENCY: ${ARAG_RUN_CONCURRENCY:-8}
      ARAG_RATE_LIMIT_RUNS_PER_MIN: ${ARAG_RATE_LIMIT_RUNS_PER_MIN:-20}
      ARAG_MONTHLY_TOKEN_LIMIT: ${ARAG_MONTHLY_TOKEN_LIMIT:-0}
    ports: ["${API_PORT:-8100}:8000"]
    volumes: [storage:/data/storage]
    depends_on:
      postgres: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      redis: { condition: service_healthy }

  # 評価・CLI 用の api（arag.eval / arag.cli が X-Dev-User-Id で直接叩く）。`make eval-api` で起動する。
  # 開発用ヘッダは誰でも管理者を名乗れるので、既定では起動せず、ホストの 127.0.0.1 だけで待ち受ける
  api-eval:
    extends: { service: api }
    profiles: [eval]
    environment:
      ARAG_AUTH_MODE: dev
    ports: !override ["127.0.0.1:${EVAL_API_PORT:-8101}:8000"]

  worker:
    build: ./api
    command: ["python", "-m", "arag.ingest.worker"]
    environment: *api-env
    volumes: [storage:/data/storage, hf-cache:/data/hf]
    healthcheck: { disable: true }
    restart: on-failure:3
    depends_on:
      api: { condition: service_healthy }  # マイグレーション済みを待つ

  runner:
    # 回答の生成（runs 表を取り出して実行し、Redis Stream にイベントを流す）
    build: ./api
    command: ["python", "-m", "arag.agent.runner"]
    environment: *api-env
    volumes: [storage:/data/storage, hf-cache:/data/hf]  # 質問に添えた画像を読む（specs/017）
    healthcheck: { disable: true }
    restart: on-failure:3
    depends_on:
      api: { condition: service_healthy }

  web:
    build: ./web
    environment:
      API_BASE_URL: http://api:8000
      ARAG_FORWARD_SECRET: ${ARAG_FORWARD_SECRET:-}
      # Better Auth（specs/006-auth）。BETTER_AUTH_URL はブラウザから見た URL
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3100}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?.env に BETTER_AUTH_SECRET を設定してください}
      ARAG_AUTH_DATABASE_URL: postgresql://arag:arag@postgres:5432/arag
      ARAG_SMTP_URL: ${ARAG_SMTP_URL:-smtp://mailpit:1025}
      ARAG_MAIL_FROM: ${ARAG_MAIL_FROM:-ARag <no-reply@arag.local>}
      # 認証なしで動かす開発構成にするときだけ設定する（例 dev）
      ARAG_DEV_USER_ID: ${ARAG_DEV_USER_ID:-}
    ports: ["${WEB_PORT:-3100}:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      api: { condition: service_healthy }

  # 評価用の模擬の社内システム（specs/032）: ERP :8201・保全 :8202・名簿 :8203・課題 :8204（MCP、/mcp）。
  # make up-mock で起動し、登録も入れる。障害の注入は MOCK_FAULTS か POST /_faults（docs/operations.md）
  mock-systems:
    profiles: [mock]
    build: ./mock/systems
    environment:
      # 未設定なら起動時に説明を出して止まる（ここで必須にすると、起動しない構成でも compose 全体の検証が落ちる）
      ARAG_MCP_IDENTITY_KEY: ${ARAG_MCP_IDENTITY_KEY:-}
      MOCK_TODAY: ${MOCK_TODAY:-2026-11-18}
      MOCK_FAULTS: ${MOCK_FAULTS:-}
      MOCK_ADMIN: "1"
    ports:
      - "127.0.0.1:8201:8201"
      - "127.0.0.1:8202:8202"
      - "127.0.0.1:8203:8203"
      - "127.0.0.1:8204:8204"

  # 開発用のメール受信箱（確認・再設定メールをここで見る）。UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports: ["${MAILPIT_UI_PORT:-8025}:8025", "${MAILPIT_SMTP_PORT:-1025}:1025"]

  tei-embed:
    profiles: ["cpu"]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4
    platform: linux/amd64
    command: ["--model-id", "${TEI_EMBED_MODEL:-intfloat/multilingual-e5-small}"]
    ports: ["8081:80"]
    volumes: [tei-cache:/data]

  tei-rerank:
    profiles: ["cpu"]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4
    platform: linux/amd64
    command: ["--model-id", "${TEI_RERANK_MODEL:-BAAI/bge-reranker-base}"]
    ports: ["8082:80"]
    volumes: [tei-cache:/data]

  docling:
    profiles: ["cpu", "parse"]  # parse: 軽量構成（[B]）で解析だけ CPU で動かす
    image: ghcr.io/docling-project/docling-serve-cpu:v1.38.2
    ports: ["${DOCLING_PORT:-5001}:5001"]

volumes:
  pgdata:
  qdrant:
  tei-cache:
  storage:
  hf-cache:
