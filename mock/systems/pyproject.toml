[project]
name = "mock-systems"
version = "0.1.0"
description = "評価用の模擬の社内システム（ERP・保全・名簿・課題）を MCP サーバとして出す（specs/032）"
requires-python = ">=3.13"
dependencies = [
    "mcp==1.30.0",
    "pyjwt>=2.10.1",
    "uvicorn>=0.31.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "openpyxl>=3.1.5",
    "ruff>=0.14",
    "mypy>=1.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mock_systems"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
files = ["src"]
