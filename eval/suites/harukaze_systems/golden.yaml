- id: hs10-pm04-noise
  query: PM-04 の異音の対応は今どうなっていますか？
  tags: [ja, system, time]
  as_user: hozen
  expect_tools: ['cmms|tickets']  # 作業指示（保全）か課題（Q-004）のどちらかで分かる
  key_facts:
  - any: [対応中, 作業中, 終わっていない, 完了していない]
  - any: [振動測定, WO-1109]
  - any: [小野寺]
- id: hs11-section-chief
  query: 品質保証部の部長は誰ですか？内線番号も教えてください。
  tags: [ja, system]
  as_user: seizo
  expect_tools: [directory]
  key_facts:
  - any: [三浦]
  - any: ['2501']
# ── 時点の違い（文書はある時点の記録、システムは今） ──
- id: hs12-time-6309
