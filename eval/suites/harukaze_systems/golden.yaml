# 社内システム（MCP）の題集（specs/032 T23）。資料と KB は harukaze_mix のものを使う（先に harukaze_mix を ingest）。
# 状態: 確定（2026-11-20）。利用者の指示で、1 問ずつ seed.py・元の文書と突き合わせて確定した（018 R5 の代わり）。
#   確定のときの直し: hs12 に差（2 個）、hs17 は保全の記録か課題（Q-001）のどちらでもよい、
#   hs27 は課題の管理を呼ぶこと（呼ばなければ拒否に気付けない）、hs28 は「初めて下回った」も当たり。
# 値は mock/systems の seed.py（MOCK_TODAY=2026-11-18）と eval/assets/harukaze_mix/docs の元の表で確かめた。
# 準備: make up-mock → uv run python -m arag.cli eval-users --suite harukaze_systems
# tags: docs（文書だけ・対照）/ system（システムだけ）/ cross（文書とシステムをまたぐ）/ time（時点の違い）/
#       perm（権限）/ fault（止まっている・遅い・拒否）/ injection（データの中の指示）/ en
suite: harukaze_systems
kb_suite: harukaze_mix
files_dir: eval/assets/harukaze_mix/docs
users: eval/assets/harukaze_systems/users.yaml
documents:
- d01-仕様書_HP-300.pdf
- d02-仕様書_HP-320.pdf
- e01-Penang-HP-300-overhaul-procedure.docx
- e02-Aster-Seals-SK-300-datasheet.pdf
- p01-月次報告_2026-09.pptx
- p02-工場紹介_浜松第二工場.pptx
- p03-新人安全教育.pptx
- s01-月次点検票_PM-04_走査.pdf
- s02-支払条件変更のお知らせ_走査.pdf
- w01-設備保全規程.docx
- w02-HP-300分解手順書_第2版.docx
- w03-HP-300分解手順書_第3版.docx
- w04-品質会議議事録_2026-09.docx
- x01-部品台帳.xlsx
- x02-保守記録_2026-09.xlsx
- x03-価格表_2026下期.xlsx
thresholds: {}
cases:
# ── 文書だけ（対照）: 社内システムを呼ばずに答える ──
- id: hs01-docs-torque
  query: HP-300 のケーシングボルトの締付トルクはいくつですか？
  tags: [ja, docs]
  as_user: hozen
  relevant_documents: [w03-HP-300分解手順書_第3版.docx]
  key_facts:
  - any: ['52']
- id: hs02-docs-retention
  query: 設備保全規程では、点検の記録を何年間保存することになっていますか？
  tags: [ja, docs]
  as_user: hozen
  relevant_documents: [w01-設備保全規程.docx]
  key_facts:
  - any: [5年]
- id: hs03-docs-supplier
  query: 羽根車 IM-320 の仕入先はどこですか？
  tags: [ja, docs]
  as_user: seizo
  relevant_documents: [x01-部品台帳.xlsx]
  key_facts:
  - any: [白砂鋳造]
# ── システムだけ ──
- id: hs04-stock-now
  query: シールキット SK-300 は今、発注点を満たしていますか？
  tags: [ja, system, time]
  as_user: hinsho
  expect_tools: [erp]
  key_facts:
  - any: ['15']
  - any: [満たして, 上回って, 以上]
  expect_caveat:
  - any: ['時点', '現在', '今', '11月18日', '11/18', '2026-11-18']
- id: hs05-below-reorder
  query: 今、在庫が発注点を下回っている部品はどれですか？
  tags: [ja, system, time]
  as_user: seizo
  expect_tools: [erp]
  key_facts:
  - any: [6309ZZ, P-2011]
  - any: [MS-30, P-1043]
  wrong_facts:
  - any: [SK-300 が下回, P-1042 が下回]
- id: hs06-overdue-po
  query: 納期を過ぎても入荷していない発注はありますか？
  tags: [ja, system]
  as_user: kobai
  expect_tools: [erp]
  key_facts:
  - any: [PO-2026-0436]
  - any: [6309ZZ, P-2011]
  - any: [11月17日, 11/17, '2026-11-17']
- id: hs07-moves
  query: SK-300 の 10 月以降の入出庫の履歴を教えてください。
  tags: [ja, system]
  as_user: seizo
  expect_tools: [erp]
  key_facts:
