  - any: [10月27日, 10/27, '2026-10-27']
- id: hs08-open-po-aster
  query: Aster Seals への発注で、まだ入荷していないものはありますか？
  tags: [ja, system]
  as_user: seizo
  expect_tools: [erp]
  key_facts:
  - any: [PO-2026-0433]
  - any: [MS-30, P-1043]
  - any: [11月28日, 11/28, '2026-11-28']
- id: hs09-al01-oct
  query: 組立ライン1号で 10 月に行った保全作業は何ですか？
  tags: [ja, system]
  as_user: hozen
  expect_tools: [cmms]
