# 大きい世界（specs/034）の題集。社内システムの ERP は ERP の MCP サーバ（specs/033）、名簿は模擬（mock-systems）。
# 状態: 確定（2026-11-20）。利用者の指示で、1 問ずつ answers.py の根拠（# 根拠）と元の表を突き合わせて確定した。
# 答えは手で書かない: cases は `uv run python -m harukaze_sim answers eval/assets/harukaze_plant/world.db` の出力そのもの
#   （sim/tests/test_answers.py が一致を確かめる）。文書は sim の docs で world.db から作った（eval/assets/harukaze_plant/docs）。
# 準備: ERP_TODAY=2026-11-18 で erp-mcp を起こす（mock: ERP_BACKEND=mock、Odoo: make erp-reset）→ make up-erp、
#   make up-mock（名簿）→ uv run python -m arag.cli eval-users --suite harukaze_plant。手順は docs/operations.md。
# 結果（2026-11-20、gemma4-12b）: mock 事実網羅 0.90・Odoo 0.90、誤りの記述 0（eval/.reports/hp-gemma4-12b-034-{mock2,odoo}）。
