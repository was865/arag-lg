# 開発用の上書き（docker compose が compose.yaml と一緒に自動で読む）。
# ソースを容器に載せ、変えたらその場で反映する。作り直し（--build）は依存を変えたときだけでよい。
#   web            … next dev（3100 のまま。/dev/ui も見える）。src・public などを載せ、保存すると画面が変わる
#   api            … uvicorn --reload（api/src を見る）
#   runner/worker  … watchfiles が api/src の変化で作り直さずに再起動する（実行中の回答・入庫は途中で切れる）
# 本番と同じ構成で確かめるときは make up-prod（= docker compose -f compose.yaml ...。この上書きを読まない）。
# CI は COMPOSE_FILE=compose.yaml で本番の構成を確かめる。

services:
  api:
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn arag.main:create_app --factory --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src
    volumes:
      - storage:/data/storage
      - ./api/src:/app/src:ro
      - ./api/alembic:/app/alembic:ro

  worker:
    command: ["watchfiles", "--sigint-timeout", "5", "python -m arag.ingest.worker", "/app/src"]
    volumes:
      - storage:/data/storage
      - hf-cache:/data/hf
      - ./api/src:/app/src:ro
      - ./api/alembic:/app/alembic:ro

  runner:
    command: ["watchfiles", "--sigint-timeout", "5", "python -m arag.agent.runner", "/app/src"]
    volumes:
      - storage:/data/storage
      - hf-cache:/data/hf
      - ./api/src:/app/src:ro
      - ./api/alembic:/app/alembic:ro

  web:
    build:
      context: ./web
      target: deps  # 依存（Linux 用の node_modules）だけ入った段。ソースは下で載せる
    command: ["pnpm", "dev", "--hostname", "0.0.0.0", "--port", "3000"]
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./web:/app
      # Mac の node_modules・.next を容器に見せない（容器の中の Linux 用を使う）。
      # 依存を変えたら make up（--renew-anon-volumes で作り直す）
      - /app/node_modules
      - /app/.next
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
